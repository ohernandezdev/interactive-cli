<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>interactive-cli social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0d14}
body{position:relative;color:#e8eaf0;font:400 20px/1.5 "Geist",system-ui,sans-serif;background:
  radial-gradient(700px 420px at 88% 8%,rgba(60,207,189,0.14),transparent 70%),#0b0d14}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:16px;font-weight:600;font-size:28px;letter-spacing:-0.01em}
.brand svg{width:48px;height:48px}
h1{position:absolute;left:72px;top:190px;width:500px;font-size:68px;line-height:1.05;letter-spacing:-0.035em;font-weight:600}
.sub{position:absolute;left:72px;bottom:64px;font:400 20px/1 "Geist Mono",monospace;color:#8b93a3}
.term{position:absolute;right:72px;top:120px;width:520px;background:#0b0d14;border:1px solid rgba(255,255,255,0.14);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,0.7)}
.tb{display:flex;align-items:center;gap:8px;background:#12151d;height:52px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,0.08)}
.tb i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.18)}
.tb span{flex:1;text-align:center;font:400 15px/1 "Geist Mono",monospace;color:#8b93a3;margin-right:48px}
.scr{padding:24px 26px 28px;font:400 20px/1.85 "Geist Mono",monospace}
.p{color:#3CCFBD}.ok{color:#4ade80}.dim{color:#8b93a3}
.row{padding:0 10px;margin:0 -10px;border-radius:6px}
.on{color:#3CCFBD;background:rgba(60,207,189,0.12)}
</style>
</head>
<body>
<div class="brand">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#171b25"/><path d="M15 22 L29 32 L15 42" fill="none" stroke="#3CCFBD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 45 H50" fill="none" stroke="#3CCFBD" stroke-width="7" stroke-linecap="round"/></svg>
  interactive-cli
</div>
<h1>Give your AI agent a real terminal</h1>
<div class="sub">MCP server · Node 18+ · macOS &amp; Linux · MIT</div>
<div class="term">
  <div class="tb"><i></i><i></i><i></i><span>eas build --platform ios</span></div>
  <div class="scr">
    <div><span class="p">$</span> eas build --platform ios</div>
    <div>? Select a build profile ›</div>
    <div class="row on">❯ development</div>
    <div class="row">  preview</div>
    <div class="row">  production</div>
  </div>
</div>
</body>
</html>
